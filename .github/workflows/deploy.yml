##############################################################
# .github/workflows/deploy.yml
##############################################################

name: CI/CD — 3-Tier AWS App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION:     ${{ secrets.AWS_REGION }}
  TF_WORKING_DIR: ./terraform

jobs:
  # ── Job 1: Test ───────────────────────────────────────────
  test:
    name: Lint & Test Node.js App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/backend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present || true
      - run: npm test --if-present || true

  # ── Job 2: Plan (PRs only) ────────────────────────────────
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - run: terraform init
      - run: terraform fmt -check -recursive
      - run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_aws_region:               ${{ secrets.AWS_REGION }}
          TF_VAR_key_name:                 ${{ secrets.TF_VAR_KEY_NAME }}
          TF_VAR_db_password:              ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_db_username:              ${{ secrets.TF_VAR_DB_USERNAME }}
          TF_VAR_db_name:                  ${{ secrets.TF_VAR_DB_NAME }}
          TF_VAR_allowed_ssh_cidr:         ${{ secrets.TF_VAR_ALLOWED_SSH_CIDR }}
          TF_VAR_grafana_admin_password:   ${{ secrets.TF_VAR_GRAFANA_ADMIN_PASSWORD }}
          TF_VAR_project_name:             ${{ vars.TF_VAR_PROJECT_NAME }}
          TF_VAR_environment:              ${{ vars.TF_VAR_ENVIRONMENT }}
          TF_VAR_frontend_instance_type:   ${{ vars.TF_VAR_FRONTEND_INSTANCE_TYPE }}
          TF_VAR_backend_instance_type:    ${{ vars.TF_VAR_BACKEND_INSTANCE_TYPE }}
          TF_VAR_monitoring_instance_type: ${{ vars.TF_VAR_MONITORING_INSTANCE_TYPE }}
          TF_VAR_db_instance_type:         ${{ vars.TF_VAR_DB_INSTANCE_TYPE }}
        run: terraform plan -no-color

      - name: Comment plan on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo:  context.repo.repo,
              body:  '✅ `terraform plan` completed — review the Actions log for details.'
            })

  # ── Job 3: Apply + Deploy (main only) ────────────────────
  terraform-apply:
    name: Terraform Apply & Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - run: terraform init

      - name: Terraform Apply
        env:
          TF_VAR_aws_region:               ${{ secrets.AWS_REGION }}
          TF_VAR_key_name:                 ${{ secrets.TF_VAR_KEY_NAME }}
          TF_VAR_db_password:              ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_db_username:              ${{ secrets.TF_VAR_DB_USERNAME }}
          TF_VAR_db_name:                  ${{ secrets.TF_VAR_DB_NAME }}
          TF_VAR_allowed_ssh_cidr:         ${{ secrets.TF_VAR_ALLOWED_SSH_CIDR }}
          TF_VAR_grafana_admin_password:   ${{ secrets.TF_VAR_GRAFANA_ADMIN_PASSWORD }}
          TF_VAR_project_name:             ${{ vars.TF_VAR_PROJECT_NAME }}
          TF_VAR_environment:              ${{ vars.TF_VAR_ENVIRONMENT }}
          TF_VAR_frontend_instance_type:   ${{ vars.TF_VAR_FRONTEND_INSTANCE_TYPE }}
          TF_VAR_backend_instance_type:    ${{ vars.TF_VAR_BACKEND_INSTANCE_TYPE }}
          TF_VAR_monitoring_instance_type: ${{ vars.TF_VAR_MONITORING_INSTANCE_TYPE }}
          TF_VAR_db_instance_type:         ${{ vars.TF_VAR_DB_INSTANCE_TYPE }}
        run: terraform apply -auto-approve

      # Output reading needs no input vars — clean separate step
      - name: Capture Terraform outputs
        id: tf
        run: |
          echo "app_url=$(terraform output -raw app_url)"              >> $GITHUB_OUTPUT
          echo "bastion_ip=$(terraform output -raw bastion_public_ip)" >> $GITHUB_OUTPUT
          echo "app_ip=$(terraform output -raw app_private_ip)"        >> $GITHUB_OUTPUT
          echo "grafana_url=$(terraform output -raw grafana_url)"      >> $GITHUB_OUTPUT

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pre-trust bastion so ProxyJump doesn't hang on host-key prompt
          ssh-keyscan -H ${{ steps.tf.outputs.bastion_ip }} >> ~/.ssh/known_hosts 2>/dev/null || true

      # Fixed: ec2-user → ubuntu (Ubuntu AMI, not Amazon Linux)
      # Fixed: /opt/app → /home/ubuntu/app/app/backend (matches backend.sh clone path)
      # Fixed: pm2 restart 3tier-app → pm2 restart backend (matches --name in backend.sh)
      - name: Deploy app code via bastion
        env:
          BASTION: ${{ steps.tf.outputs.bastion_ip }}
          APP:     ${{ steps.tf.outputs.app_ip }}
        run: |
          # ── Sync backend source ───────────────────────────────────
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
                    -o ProxyJump=ubuntu@${BASTION}" \
            ../app/backend/ ubuntu@${APP}:/home/ubuntu/app/app/backend/

          # ── Sync frontend static assets ───────────────────────────
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
                    -o ProxyJump=ubuntu@${BASTION}" \
            ../app/frontend/ ubuntu@${APP}:/home/ubuntu/app/app/frontend/

          # ── Install deps + restart PM2 ────────────────────────────
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ProxyJump=ubuntu@${BASTION} \
              ubuntu@${APP} \
              "cd /home/ubuntu/app/app/backend \
               && npm install --omit=dev \
               && pm2 restart backend \
               && pm2 save"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Deployment summary
        run: |
          echo "### 🚀 Deployment complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **App URL** | ${{ steps.tf.outputs.app_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bastion IP  | ${{ steps.tf.outputs.bastion_ip }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Grafana     | ${{ steps.tf.outputs.grafana_url }} |" >> $GITHUB_STEP_SUMMARY