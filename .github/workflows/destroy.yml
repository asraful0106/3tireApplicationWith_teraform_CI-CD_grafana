##############################################################
# .github/workflows/destroy.yml
# Manual workflow to tear down the entire infrastructure
##############################################################

name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DESTROY to confirm teardown"
        required: true

env:
  TF_WORKING_DIR: ./terraform

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DESTROY'
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - run: terraform init

      - name: Terraform Destroy
        env:
          TF_VAR_aws_region:               ${{ secrets.AWS_REGION }}
          TF_VAR_key_name:                 ${{ secrets.TF_VAR_KEY_NAME }}
          TF_VAR_db_password:              ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_db_username:              ${{ secrets.TF_VAR_DB_USERNAME }}
          TF_VAR_db_name:                  ${{ secrets.TF_VAR_DB_NAME }}
          TF_VAR_allowed_ssh_cidr:         ${{ secrets.TF_VAR_ALLOWED_SSH_CIDR }}
          TF_VAR_grafana_admin_password:   ${{ secrets.TF_VAR_GRAFANA_ADMIN_PASSWORD }}
          TF_VAR_project_name:             ${{ vars.TF_VAR_PROJECT_NAME }}
          TF_VAR_environment:              ${{ vars.TF_VAR_ENVIRONMENT }}
          TF_VAR_frontend_instance_type:   ${{ vars.TF_VAR_FRONTEND_INSTANCE_TYPE }}
          TF_VAR_backend_instance_type:    ${{ vars.TF_VAR_BACKEND_INSTANCE_TYPE }}
          TF_VAR_monitoring_instance_type: ${{ vars.TF_VAR_MONITORING_INSTANCE_TYPE }}
          TF_VAR_db_instance_type:         ${{ vars.TF_VAR_DB_INSTANCE_TYPE }}
        # -lock-timeout prevents silent partial destroy if state is locked
        run: terraform destroy -auto-approve -lock-timeout=5m